<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คุงซะโฮมสเตย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2e4a3b;--green2:#3f6350;--green3:#e7efe9;
  --cream:#faf6ee;--sand:#f1e9d8;--paper:#ffffff;
  --gold:#b9803a;--gold2:#a06a28;
  --ink:#232d27;--muted:#6a746d;--line:#e3dac7;
  --red:#b4412f;--red-bg:#fbe9e5;--blue:#2f6a9e;--blue-bg:#e3eef7;
  --amber:#9a6a0a;--amber-bg:#fbf0d4;--ok:#2d7a4b;--ok-bg:#e2f3e8;--gray:#5d6660;--gray-bg:#ecece8;
  --r:14px;--shadow:0 6px 24px rgba(35,45,39,.09);--shadow2:0 14px 40px rgba(35,45,39,.16);
  --fh:'Prompt','Sarabun',sans-serif;--fb:'Sarabun','Prompt',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--fb);font-size:16px;line-height:1.6;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--fh);font-weight:600;line-height:1.3;margin:0}
p{margin:0 0 .6em}
img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.muted{color:var(--muted)}
.ic{flex:none;vertical-align:middle}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;background:linear-gradient(90deg,var(--gold),var(--green2));transform:scaleX(0);transform-origin:left;opacity:0;transition:opacity .2s}
#bar.on{opacity:1;animation:bar 1.2s ease-in-out infinite}
@keyframes bar{0%{transform:scaleX(.05)}50%{transform:scaleX(.7)}100%{transform:scaleX(1)}}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 20px;font-family:var(--fh);font-weight:500;font-size:15px;cursor:pointer;text-decoration:none;transition:.18s;background:none;white-space:nowrap}
.btn.sm{padding:7px 15px;font-size:14px}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green2)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.ghost:hover{border-color:var(--green);color:var(--green)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-o{border-color:#e5b9b0;color:var(--red);background:#fff}
.btn.danger-o:hover{background:var(--red-bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:#fff;color:var(--green);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.18s}
.icon-btn:hover{background:var(--green);color:#fff;border-color:var(--green)}
.icon-btn.sm{width:34px;height:34px}
label.f{display:block;font-size:14px;font-weight:600;color:var(--green);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15.5px;font-weight:400;color:var(--ink);outline:none;transition:.15s}
.in:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(63,99,80,.15)}
textarea.in{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* ---------- Navbar ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fh);font-weight:600;font-size:19px;color:var(--green)}
.links{display:flex;gap:26px}
.links a{text-decoration:none;font-weight:500;color:var(--ink);font-size:15.5px}
.links a:hover{color:var(--gold2)}
.nav-r{display:flex;gap:10px;align-items:center}
.burger{display:none}
.mnav{position:absolute;top:100%;left:0;right:0;background:var(--cream);border-bottom:1px solid var(--line);box-shadow:var(--shadow2);padding:6px 16px 14px;display:grid}
.mnav a{text-decoration:none;font-family:var(--fh);font-weight:500;font-size:16.5px;color:var(--ink);padding:13px 6px;border-bottom:1px solid var(--line)}
.mnav a:last-child{border-bottom:0}
.mnav a:hover{color:var(--gold2)}
@media(max-width:820px){.links{display:none}.logo span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.burger{display:grid}}
@media(min-width:821px){.mnav{display:none!important}}

/* ---------- Hero ---------- */
.hero{position:relative;color:#fff;background:linear-gradient(135deg,#2e4a3b,#52755a 55%,#b9803a);background-size:cover;background-position:center;min-height:min(86vh,720px);display:flex;align-items:center;padding:60px 0 80px}
.hero-in{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.eyebrow{font-family:var(--fh);letter-spacing:.14em;font-size:14px;opacity:.9;text-transform:uppercase}
.hero h1{font-size:clamp(36px,7vw,68px);letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.lead{font-size:clamp(17px,2.4vw,22px);max-width:640px;opacity:.95;margin-bottom:22px}
.search{background:rgba(255,255,255,.97);color:var(--ink);border-radius:20px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;box-shadow:var(--shadow2);width:min(860px,100%)}
.search label{font-size:13px;font-weight:600;color:var(--green)}
.search label span{display:block;margin-bottom:3px}
@media(max-width:760px){.search{grid-template-columns:1fr 1fr}.search .btn{grid-column:1/-1}}

/* ---------- Sections ---------- */
section.s{padding:72px 0}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head .tag{font-family:var(--fh);color:var(--gold2);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.sec-head h2{font-size:clamp(26px,4vw,38px);color:var(--green);margin-top:4px}
.sec-head p{color:var(--muted);max-width:620px;margin:10px auto 0}
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}
.about p{font-size:17.5px;white-space:pre-line}
.facts{display:grid;gap:12px}
.fact{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center}
.fact .ib{width:44px;height:44px;border-radius:12px;background:var(--green3);color:var(--green);display:grid;place-items:center}
.fact b{display:block;font-family:var(--fh);font-weight:500}
.fact small{color:var(--muted)}
@media(max-width:800px){.about{grid-template-columns:1fr}}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}
.room{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.2s}
.room:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.room .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--sand),#e2d4b6);cursor:pointer;overflow:hidden;display:grid;place-items:center;color:var(--gold)}
.room .ph img{width:100%;height:100%;object-fit:contain;transition:.4s}
.room:hover .ph img{transform:scale(1.04)}
.room .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.room .chip-av{position:absolute;left:10px;top:10px}
.room .bd{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.room h3{font-size:19px;color:var(--green)}
.room .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.room .meta span{display:inline-flex;gap:5px;align-items:center}
.room .desc{color:#4b564f;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--green3);color:var(--green);border-radius:999px;padding:2px 10px;font-size:13px}
.room .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:6px}
.price{font-family:var(--fh);font-size:24px;font-weight:600;color:var(--gold2);line-height:1}
.price small{font-size:13px;color:var(--muted);font-weight:400}
.avail-note{background:#fff;border:1px dashed var(--green2);color:var(--green);border-radius:12px;padding:10px 16px;margin:0 auto 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.gallery{columns:3 260px;column-gap:14px}
.gallery figure{margin:0 0 14px;break-inside:avoid;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--sand)}
.gallery img{width:100%;transition:.4s}
.gallery figure:hover img{transform:scale(1.04)}
.gallery figcaption{position:absolute;inset:auto 0 0 0;padding:22px 70px 10px 12px;color:#fff;font-size:14px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.gallery .cnt{position:absolute;right:10px;bottom:10px;z-index:1;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
/* ---------- Mobile slider (ห้องพัก / แกลเลอรี: มือถือแสดงทีละรายการ) ---------- */
.rd-ar.ms-ar{display:none}
@media(max-width:760px){
.rd-ar.ms-ar{display:grid}
.rooms{grid-template-columns:1fr}
.rooms>.room{display:none}
.rooms>.room.ms-on{display:flex}
.gallery{columns:1}
.gallery figure{display:none;margin:0}
.gallery figure.ms-on{display:block}
}

/* ---------- Places (carousel) ---------- */
.pl{max-width:980px;margin:0 auto}
.pl-card{display:grid;grid-template-columns:1.1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pl-card .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--sand),#e2d4b6);cursor:pointer;overflow:hidden;display:grid;place-items:center;color:var(--gold)}
.pl-card .ph>img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.pl-card .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;pointer-events:none;display:inline-flex;gap:5px;align-items:center}
.pl-card .bd{padding:26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.pl-card h3{font-size:24px;color:var(--green)}
.pl-card .desc{color:#4b564f;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pl-dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pl-dots button{width:10px;height:10px;border-radius:50%;border:0;background:#d8cdb4;padding:0;cursor:pointer}
.pl-dots button.on{background:var(--gold);width:24px;border-radius:99px}
@media(max-width:760px){.pl-card{grid-template-columns:1fr}.pl-card .bd{padding:18px}}

.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:28px}
.cbox{display:grid;gap:12px;align-content:start}
.citem{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none}
.citem .ib{width:40px;height:40px;border-radius:10px;background:var(--green3);color:var(--green);display:grid;place-items:center;flex:none}
.citem b{display:block;font-family:var(--fh);font-weight:500}
.citem span{color:var(--muted);word-break:break-word}
.citem .go{display:inline-block;margin-top:4px;background:var(--green);color:#fff;border-radius:999px;padding:3px 16px;font-family:var(--fh);font-size:13.5px;font-weight:500;transition:.18s}
.citem:hover .go{background:var(--green2)}
.map{border:0;width:100%;min-height:340px;height:100%;border-radius:var(--r);background:var(--sand)}
.mrev{margin-top:32px}
.mrev-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mrev-h h3{font-size:20px;color:var(--green)}
.mrev-sum{display:flex;align-items:center;gap:10px;color:var(--muted);flex-wrap:wrap}
.mrev-sum b{font-family:var(--fh);font-size:26px;color:var(--ink);line-height:1}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.mrev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rv-c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.rv-a{display:flex;align-items:center;gap:10px;text-decoration:none}
.rv-a img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--sand);flex:none}
.rv-a b{display:block;font-family:var(--fh);font-weight:500;line-height:1.3}
.rv-a small{color:var(--muted)}
.rv-c p{margin:0;font-size:15px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mrev-f{margin-top:12px;font-size:13px;color:var(--muted)}
.policy{background:var(--green);color:#fff;border-radius:var(--r);padding:20px 22px}
.policy h3{font-size:17px;margin-bottom:8px}
.policy ul{margin:0;padding-left:20px}
@media(max-width:820px){.contact{grid-template-columns:1fr}}
footer.ft-site{background:var(--green);color:#e8efe9;padding:30px 0}
footer .row{justify-content:space-between}
footer .icon-btn{background:transparent;color:#e8efe9;border-color:rgba(255,255,255,.3)}
footer .icon-btn:hover{background:#fff;color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- Badges ---------- */
.badge{display:inline-block;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.b-amber{background:var(--amber-bg);color:var(--amber)}.b-green{background:var(--ok-bg);color:var(--ok)}
.b-blue{background:var(--blue-bg);color:var(--blue)}.b-gray{background:var(--gray-bg);color:var(--gray)}.b-red{background:var(--red-bg);color:var(--red)}

/* ---------- Modals ---------- */
.ov{position:fixed;inset:0;background:rgba(20,28,23,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.ov.top{z-index:400;align-items:center}
.md{background:var(--cream);border-radius:20px;width:min(560px,100%);padding:26px;position:relative;box-shadow:var(--shadow2);animation:pop .2s ease}
.md.lg{width:min(860px,100%)}.md.sm{width:min(420px,100%)}.md.xl{width:min(980px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.md>h3{font-size:22px;color:var(--green);margin-bottom:16px;padding-right:36px}
.md .x{position:absolute;top:14px;right:14px;border:0;background:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
.dlg-msg{font-size:17px;margin-bottom:18px}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:4px 0 16px}
.sum .tot{font-family:var(--fh);font-size:22px;font-weight:600;color:var(--gold2)}
.sum .av{font-size:14px;font-weight:600}
.sum .av.ok{color:var(--ok)}.sum .av.no{color:var(--red)}
.okbox{text-align:center}
.okbox .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.code{font-family:var(--fh);font-size:26px;letter-spacing:.06em;background:#fff;border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;display:inline-block;margin:6px 0 12px;color:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.rd-main{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--sand),#e2d4b6);display:grid;place-items:center;color:var(--gold);margin-bottom:10px}
.rd-main img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.rd-ar{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.22);z-index:1;transition:.15s}
.rd-ar:hover{background:#fff;color:var(--green)}
.rd-l{left:10px}.rd-r{right:10px}
.rd-cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;pointer-events:none}
.rd-th{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.rd-th img{flex:none;width:78px;height:56px;object-fit:contain;background:var(--sand);border-radius:8px;cursor:pointer;opacity:.65;border:2px solid transparent;transition:.15s}
.rd-th img:hover{opacity:.9}
.rd-th img.on{opacity:1;border-color:var(--gold)}
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(10,14,12,.94);display:flex;align-items:center;justify-content:center}
#lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none}
#lightbox .lb-cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff}
#lightbox button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#lightbox button:hover{background:rgba(255,255,255,.3)}
.lb-x{top:16px;right:16px;z-index:2}.lb-p{left:14px;top:50%;transform:translateY(-50%);z-index:2}.lb-n{right:14px;top:50%;transform:translateY(-50%);z-index:2}
#lightbox .lb-c{position:absolute;top:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px;opacity:.85;pointer-events:none}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;display:grid;gap:8px;width:min(440px,calc(100% - 28px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow2);animation:pop .2s;display:flex;gap:10px;align-items:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--ok)}

/* ---------- Admin ---------- */
#adm{min-height:100vh;background:#f4f1e9}
.adm-wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--green);color:#e9f0ea;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;gap:10px;align-items:center;padding:6px 10px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.side .brand b{display:block;font-family:var(--fh);font-weight:600;line-height:1.2;color:#fff}
.side .brand small{opacity:.7}
.side nav{display:flex;flex-direction:column;gap:3px}
.nb{display:flex;align-items:center;gap:11px;border:0;background:none;color:#dce7df;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:var(--fh);font-size:15px;position:relative}
.nb:hover{background:rgba(255,255,255,.08)}
.nb.on{background:#fff;color:var(--green);font-weight:600}
.nb .dot{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;font-size:12px;min-width:22px;text-align:center;padding:0 6px}
.side-foot{margin-top:auto;display:grid;gap:6px}
.adm-main{padding:28px clamp(14px,3vw,36px) 60px;min-width:0}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.adm-top h2{font-size:26px;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(35,45,39,.04)}
.card h3{font-size:17px;margin-bottom:14px;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ib{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--green3);color:var(--green)}
.kpi .ib.g{background:#f7e9d0;color:var(--gold2)}.kpi .ib.b{background:var(--blue-bg);color:var(--blue)}.kpi .ib.a{background:var(--amber-bg);color:var(--amber)}
.kpi small{color:var(--muted);display:block}
.kpi b{font-family:var(--fh);font-size:26px;line-height:1.2;font-weight:600}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1000px){.cols,.cols3{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;min-width:0}
.bar i{display:block;width:100%;max-width:56px;background:linear-gradient(180deg,var(--green2),var(--green));border-radius:8px 8px 3px 3px;min-height:3px;transition:height .5s}
.bar span{font-size:12.5px;color:var(--muted)}
.bar em{font-style:normal;font-size:12px;font-weight:600;color:var(--green);white-space:nowrap}
.stat{display:grid;gap:10px}
.stat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px}
.meter{height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--green2)}
.lst{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--cream);border-radius:10px;align-items:center;font-size:14.5px}
.li small{color:var(--muted);display:block}
.tbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.tbar .in{width:auto;min-width:150px}
.tbar .grow{flex:1;min-width:200px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{background:var(--sand);color:var(--green);text-align:left;font-family:var(--fh);font-weight:500;padding:11px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fcfaf5}
td small{color:var(--muted);display:block}
td.num,th.num{text-align:right}
td .sel{border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:#fff;font-size:13.5px;cursor:pointer}
.acts{display:flex;gap:6px;justify-content:flex-end}
.cal{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.cal table{font-size:13px;min-width:900px}
.cal th,.cal td{text-align:center;padding:6px 3px;border-left:1px solid var(--line);min-width:30px}
.cal th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cal th.we{background:#efe3c8}.cal th.today{background:var(--gold);color:#fff}.cal th.today small{color:#fff}
.cal td.rn,.cal th.rn{text-align:left;min-width:170px;position:sticky;left:0;background:#fff;z-index:1;font-family:var(--fh);font-weight:500;border-left:0}
.cal th.rn{background:var(--sand);z-index:2}
.cal td.c{cursor:pointer;height:38px;font-weight:700;font-size:13px}
.cal td.c.part{background:#cfe3d6;color:var(--green)}.cal td.c.full{background:var(--green);color:#fff}
.cal td.c:hover{outline:2px solid var(--gold);outline-offset:-2px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:10px 0 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.rc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.rc .ph{aspect-ratio:16/9;background:linear-gradient(135deg,var(--sand),#e2d4b6);display:grid;place-items:center;color:var(--gold);position:relative}
.rc .ph img{width:100%;height:100%;object-fit:contain}
.rc .ph .badge{position:absolute;left:10px;top:10px}
.rc .bd{padding:14px 16px;display:grid;gap:6px}
.rc h4{font-size:17px;color:var(--green)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gi{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gi img{aspect-ratio:1;object-fit:contain;width:100%;background:var(--sand)}
.gi .bd{padding:8px 10px;display:grid;gap:6px;font-size:13.5px}
.gi .cap{color:var(--muted);min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:8px 0 12px}
.thumb{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.thumb.main{border-color:var(--gold)}
.thumb img{aspect-ratio:4/3;object-fit:contain;width:100%;background:var(--sand)}
.thumb .tools{display:flex;justify-content:space-between;gap:4px;padding:4px 6px;font-size:12px;align-items:center}
.thumb .tools button{border:0;background:var(--sand);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.thumb .tools button:last-child{background:var(--red-bg);color:var(--red)}
.hero-prev{aspect-ratio:16/6;border-radius:12px;background:var(--sand) center/cover;border:1px solid var(--line);margin:6px 0 10px}
.adm-burger{display:none;margin-left:auto;flex:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.adm-burger:hover{background:#fff;color:var(--green)}
.cols>*,.cols3>*,.kpis>*{min-width:0}
.cols.cols2{grid-template-columns:1fr 1fr}
.pos{color:var(--ok)}.neg{color:var(--red)}
.fin-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:1000px){.cols.cols2{grid-template-columns:1fr}}
@media(max-width:900px){
  .adm-wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:60;height:auto;max-height:100vh;overflow-y:auto;padding:10px 14px;gap:0;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .side .brand{padding:0;margin:0;border-bottom:0}
  .side .brand>div:not(.x){min-width:0}
  .side .brand b,.side .brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
  .adm-burger{display:grid}
  .side nav,.side-foot{display:none}
  .side.open .brand{padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14)}
  .side.open nav{display:flex;flex-direction:column}
  .side.open .side-foot{display:grid;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
  .nb{padding:12px 13px}
  .adm-main{padding:18px 14px 60px}
  .adm-top h2{font-size:22px}
}
@media(max-width:600px){
  .card{padding:16px}
  .kpis{gap:12px}
  .kpi b{font-size:22px}
  .bars{gap:6px}
  .bar em{font-size:10px}
  .tbar>label{flex:1 1 140px;min-width:0}
  .tbar .grow{flex-basis:100%}
  .tbar .in{width:100%;min-width:0}
  .rgrid{grid-template-columns:1fr}
  .md{padding:20px 16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="bar"></div>
<div id="pub"><div class="wrap muted" style="padding:120px 0;text-align:center">กำลังโหลด…</div></div>
<div id="adm" hidden></div>
<div id="modal-root"></div>
<div id="dlg-root"></div>
<div id="lightbox" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ============================================================
 *  ตั้งค่า API  >>> วาง "Web app URL" (ลงท้ายด้วย /exec) ที่ได้จากการ Deploy Apps Script ระหว่างเครื่องหมาย ' '
 * ============================================================ */
const API_URL = 'วางลิงก์ Web app URL ที่ลงท้ายด้วย /exec ตรงนี้';

/* ============================================================
 *  Helpers
 * ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '฿' + Number(n || 0).toLocaleString('th-TH');
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => isoOf(new Date());
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoOf(d); };
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split('-').map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split('-').map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
const fmtDate = s => s ? parseD(s.slice(0, 10)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '-';
const fmtDT = s => s ? new Date(s).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
const BLOCK = ['pending', 'confirmed', 'checked-in'];
const ST = { pending: ['รอยืนยัน', 'amber'], confirmed: ['ยืนยันแล้ว', 'green'], 'checked-in': ['เข้าพักแล้ว', 'blue'], completed: ['เสร็จสิ้น', 'gray'], cancelled: ['ยกเลิก', 'red'] };
const badge = s => `<span class="badge b-${(ST[s] || [0, 'gray'])[1]}">${esc((ST[s] || [s])[0])}</span>`;
const statusOpts = sel => Object.keys(ST).map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${ST[k][0]}</option>`).join('');

const P = d => `<path d="${d}"/>`;
const ICON = {
  chart: P('M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3'), list: P('M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'),
  cal: P('M4 5h16v15H4zM4 10h16M8 3v4M16 3v4'), bed: P('M3 18V7M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6'),
  image: P('M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01'), cog: P('M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4'),
  out: P('M9 4H5v16h4M16 8l4 4-4 4M20 12H9'), phone: P('M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z'),
  pin: P('M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 10h.01'), plus: P('M12 5v14M5 12h14'), x: P('M6 6l12 12M18 6L6 18'),
  edit: P('M4 20h4L19 9l-4-4L4 16zM14 6l4 4'), trash: P('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13'), search: P('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4'),
  check: P('M5 12l5 5 9-10'), user: P('M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'), users: P('M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 6M19 20a6 6 0 0 0-3-5.2'),
  clock: P('M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2'), mail: P('M3 6h18v12H3zM3 7l9 7 9-7'), fb: P('M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z'),
  chat: P('M4 5h16v11H9l-5 4z'), left: P('M15 5l-7 7 7 7'), right: P('M9 5l7 7-7 7'), up: P('M12 16V5M6 11l6-6 6 6M5 20h14'), download: P('M12 4v11M7 11l5 5 5-5M5 20h14'),
  tiktok: P('M14 4v10a3.5 3.5 0 1 1-3.5-3.5M14 4c.3 2.3 2 4 4.5 4.2'),
  money: P('M12 3v18M16 7.5C15 6.5 13.7 6 12 6c-2 0-3.5 1-3.5 2.6S10 11 12 11.5s3.5 1 3.5 2.9S14 18 12 18c-1.7 0-3.2-.6-4-1.7'), home: P('M3 11l9-8 9 8M5 10v10h14V10'), eye: P('M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'),
  menu: P('M4 6h16M4 12h16M4 18h16'), wallet: P('M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4zM4 7V6a2 2 0 0 1 2-2h10M16 13.5h.01'), compass: P('M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z')
};
const ic = (n, s) => `<svg class="ic" width="${s || 20}" height="${s || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
/* ไอคอนบ้านทรงไทย (เรือนไทยยกใต้ถุน หลังคาจั่วทรงสูง มีช่อฟ้า) */
const HOUSE = s => `<svg class="ic" width="${s || 28}" height="${s || 28}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 3.2 16 7l3.5-3.8"/><path d="M2.5 17c8-1.2 12-5 13.5-10 1.5 5 5.5 8.8 13.5 10"/><path d="M5 17.2h22"/><path d="M8 17.5V24h16v-6.5"/><path d="M14 24v-4.6h4V24"/><path d="M9.5 24v5M16 24v5M22.5 24v5"/><path d="M6 29h20"/></svg>`;

const state = { pub: null, token: '', admin: null, tab: 'dashboard', avail: null, bf: { q: '', status: '', from: '', to: '' }, calMonth: '', tmpImgs: [], rv: null, rvI: 0, mapRev: null, plI: 0, rmI: 0, glI: 0, finMonth: todayStr().slice(0, 7) };
try { state.token = sessionStorage.getItem('ks_token') || ''; } catch (e) { /* ignore */ }
const saveToken = t => { state.token = t || ''; try { t ? sessionStorage.setItem('ks_token', t) : sessionStorage.removeItem('ks_token'); } catch (e) { /* ignore */ } };

let busyN = 0;
function busy(d) { busyN = Math.max(0, busyN + d); $('#bar').classList.toggle('on', busyN > 0); }

function api(action, payload) {
  busy(1);
  return new Promise((res, rej) => {
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(API_URL)) {
      busy(-1);
      return rej(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html (ให้วาง Web app URL ที่ลงท้ายด้วย /exec)'));
    }
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload || {}, token: state.token || '' })
    })
      .then(resp => resp.json())
      .then(r => {
        busy(-1);
        if (!r) return rej(new Error('ไม่มีการตอบกลับจากเซิร์ฟเวอร์'));
        if (r.ok) return res(r.data);
        if (r.error === 'SESSION_EXPIRED') { sessionExpired(); return rej(new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่')); }
        rej(new Error(r.error || 'เกิดข้อผิดพลาด'));
      }, () => { busy(-1); rej(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ')); });
  });
}

function toast(msg, type, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'err' ? 5000 : 2800));
}
const fail = e => toast((e && e.message) || String(e), 'err');

function openModal(html, cls) {
  $('#modal-root').innerHTML = `<div class="ov" data-act="ovclose"><div class="md ${cls || ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
}
function closeModal() { $('#modal-root').innerHTML = ''; document.body.classList.remove('noscroll'); }
const xBtn = `<button type="button" class="x" data-act="close" aria-label="ปิด">${ic('x', 18)}</button>`;

function askConfirm(msg, ok, danger) {
  return new Promise(res => {
    const r = $('#dlg-root');
    r.innerHTML = `<div class="ov top"><div class="md sm"><p class="dlg-msg">${esc(msg)}</p><div class="row end"><button class="btn ghost" data-dlg="0">ยกเลิก</button><button class="btn ${danger ? 'danger' : 'primary'}" data-dlg="1">${esc(ok || 'ยืนยัน')}</button></div></div></div>`;
    r.onclick = e => { const b = e.target.closest('[data-dlg]'); if (!b) return; r.innerHTML = ''; r.onclick = null; res(b.dataset.dlg === '1'); };
  });
}
function askInput(title, val) {
  return new Promise(res => {
    const r = $('#dlg-root');
    r.innerHTML = `<div class="ov top"><form class="md sm" id="dlg-f"><h3 style="font-size:18px;margin-bottom:12px;color:var(--green)">${esc(title)}</h3><input class="in" id="dlg-i" value="${esc(val || '')}" maxlength="200"><div class="row end" style="margin-top:14px"><button type="button" class="btn ghost" data-dlg="0">ยกเลิก</button><button class="btn primary">บันทึก</button></div></form></div>`;
    const done = v => { r.innerHTML = ''; r.onclick = null; res(v); };
    r.onclick = e => { if (e.target.closest('[data-dlg="0"]')) done(null); };
    $('#dlg-f').onsubmit = e => { e.preventDefault(); done($('#dlg-i').value.trim()); };
    setTimeout(() => { const i = $('#dlg-i'); if (i) i.focus(); }, 30);
  });
}
function copyText(t) {
  const fallback = () => { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } a.remove(); toast('คัดลอกแล้ว', 'ok'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว', 'ok'), fallback); else fallback();
}

function toImageUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (u.indexOf('lh3.googleusercontent.com/d/') > -1) return u;
  const m = u.match(/\/d\/([a-zA-Z0-9_-]{20,})/) || u.match(/[?&]id=([a-zA-Z0-9_-]{20,})/) || u.match(/^([a-zA-Z0-9_-]{25,})$/);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=s1000?authuser=0' : u;
}
const lineLink = id => { id = (id || '').trim(); if (!id) return ''; if (/^https?:/i.test(id)) return id; return 'https://line.me/R/ti/p/' + (id.charAt(0) === '@' ? id : '~' + id); };
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const tiktokLink = v => { v = (v || '').trim(); if (!v) return ''; if (/^https?:/i.test(v)) return v; return 'https://www.tiktok.com/@' + v.replace(/^@/, ''); };
const bigImg = u => String(u || '').replace(/(lh3\.googleusercontent\.com\/d\/[^=?]+)=s\d+/, '$1=s1800');
function addSwipe(el, cb) {
  let x0 = 0, y0 = 0;
  el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  el.addEventListener('touchend', e => { const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) cb(dx < 0 ? 1 : -1); }, { passive: true });
}
function mapSrc(v) {
  v = (v || '').trim(); if (!v) return '';
  const m = v.match(/src=["']([^"']+)["']/); const u = (m ? m[1] : v).replace(/&amp;/g, '&');
  return /^https:\/\/www\.google\.com\/maps(\/|\?)/.test(u) ? u : '';
}

/* ---------- Image upload (resize in browser → Drive) ---------- */
function pickFiles(multiple) {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multiple; i.style.display = 'none';
    document.body.appendChild(i);
    i.onchange = () => { const f = Array.from(i.files || []); i.remove(); res(f); };
    i.click();
  });
}
function fileToPayload(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('ไฟล์ ' + file.name + ' ไม่ใช่รูปภาพ'));
    if (file.type === 'image/gif') {
      const fr = new FileReader();
      fr.onload = () => res({ name: file.name, mime: file.type, data: String(fr.result).split(',')[1] });
      fr.onerror = () => rej(new Error('อ่านไฟล์ไม่สำเร็จ'));
      return fr.readAsDataURL(file);
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.86).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูป ' + file.name + ' ไม่ได้')); };
    img.src = url;
  });
}
async function uploadFiles(files) {
  const urls = [];
  let warned = false;
  for (let i = 0; i < files.length; i++) {
    toast('กำลังอัปโหลดรูป ' + (i + 1) + '/' + files.length + ' …', '', 1800);
    const r = await api('uploadImage', await fileToPayload(files[i]));
    urls.push(r.url);
    if (r.warning && !warned) { warned = true; toast(r.warning, 'err', 12000); }
  }
  return urls;
}

function msArrows(p, n, lp, ln) {

}
function msShow(sel, key, i) {
  const items = document.querySelectorAll(sel), n = items.length; if (!n) return;

}

async function onSearch(e) {
  e.preventDefault();
  const f = e.target, ci = f.ci.value, co = f.co.value, g = parseInt(f.g.value, 10) || 1;
  if (!ci || !co) return toast('กรุณาเลือกวันเช็คอินและเช็คเอาท์', 'err');
  if (co <= ci) return toast('วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน', 'err');
  try {
    const d = await api('availabilityAll', { checkIn: ci, checkOut: co });
    state.avail = { ci, co, guests: g, nights: d.nights, map: d.map };
    drawRooms();
    scrollToId('rooms');

}

function rdShow(i) {

let bkSeq = 0, bkTimer = 0;
function openBooking(roomId, pre) {

  pre = pre || (state.avail ? { ci: state.avail.ci, co: state.avail.co, g: state.avail.guests } : {});

  openModal(`${xBtn}<h3>จองห้องพัก</h3>

        <label class="f"><span>อีเมล (ใช้รับอีเมลแจ้งสถานะการจอง)</span><input class="in" name="email" type="email" maxlength="100" autocomplete="email" required></label>

      </div>

    </form>`);
  const f = $('#bk-form');
  ['roomId', 'checkIn', 'checkOut', 'guests'].forEach(n => { f[n].addEventListener('input', bkRefresh); f[n].addEventListener('change', bkRefresh); });
  f.checkIn.addEventListener('change', () => { if (f.checkIn.value) { f.checkOut.min = addDays(f.checkIn.value, 1); if (f.checkOut.value && f.checkOut.value <= f.checkIn.value) f.checkOut.value = addDays(f.checkIn.value, 1); bkRefresh(); } });
  f.phone.addEventListener('input', () => { const v = f.phone.value.replace(/\D/g, '').slice(0, 10); if (v !== f.phone.value) f.phone.value = v; });
  f.onsubmit = onBook;
  bkRefresh();
}

function bkRefresh() {
  const f = $('#bk-form'); if (!f) return;
  const room = roomById(f.roomId.value), box = $('#bk-sum'), ci = f.checkIn.value, co = f.checkOut.value;
  f.guests.max = room.capacity;
  if (!ci || !co || co <= ci) { box.innerHTML = '<span class="muted">เลือกวันเช็คอินและเช็คเอาท์เพื่อดูราคารวม</span>'; return; }
  const n = dayDiff(ci, co), seq = ++bkSeq;
  box.innerHTML = `<div class="row between"><span>${money(room.price)} × ${n} คืน</span><span class="tot">${money(n * room.price)}</span></div><div class="av" id="bk-av">กำลังตรวจสอบห้องว่าง…</div>`;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(() => {
    api('availabilityAll', { checkIn: ci, checkOut: co }).then(d => {
      if (seq !== bkSeq || !$('#bk-av')) return;
      const a = d.map[room.id] || 0, el = $('#bk-av');
      el.className = 'av ' + (a > 0 ? 'ok' : 'no');
      el.textContent = a > 0 ? '✓ ห้องว่างในช่วงวันที่เลือก' : '✗ ห้องเต็มในช่วงวันที่เลือก กรุณาเลือกวันหรือห้องอื่น';
      $('#bk-submit').disabled = a <= 0;
    }).catch(() => { const el = $('#bk-av'); if (el) el.textContent = ''; });
  }, 350);
}

async function onBook(e) {
  e.preventDefault();
  const f = e.target, room = roomById(f.roomId.value), guests = parseInt(f.guests.value, 10) || 0;
  if (!f.checkIn.value || !f.checkOut.value) return toast('กรุณาเลือกวันเข้าพัก', 'err');
  if (f.checkOut.value <= f.checkIn.value) return toast('วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน', 'err');
  if (guests < 1 || guests > room.capacity) return toast('ห้องนี้รองรับ 1 - ' + room.capacity + ' ท่าน', 'err');
  if (f.guestName.value.trim().length < 2) return toast('กรุณากรอกชื่อผู้จอง', 'err');
  if (!/^[0-9]{10}$/.test(f.phone.value.trim())) return toast('เบอร์โทรศัพท์ต้องเป็นตัวเลข 0-9 จำนวน 10 หลักเท่านั้น', 'err');
  if (!f.email.value.trim()) return toast('กรุณากรอกอีเมล', 'err');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return toast('รูปแบบอีเมลไม่ถูกต้อง', 'err');
  const btn = $('#bk-submit'); btn.disabled = true; btn.textContent = 'กำลังส่งคำขอ…';
  try {
    const r = await api('createBooking', { roomId: room.id, checkIn: f.checkIn.value, checkOut: f.checkOut.value, guests, guestName: f.guestName.value, phone: f.phone.value.trim(), email: f.email.value.trim(), guestLine: f.guestLine.value.trim(), note: f.note.value });
    const lineHref = safeUrl(lineLink(state.pub.settings.lineId));
    openModal(`${xBtn}<div class="okbox">
      <div class="tick">${ic('check', 34)}</div><h3 style="padding:0;margin-bottom:4px">ส่งคำขอจองเรียบร้อย</h3>
      <p class="muted">กรุณาเก็บรหัสการจองไว้ใช้ตรวจสอบสถานะ</p>
      <div class="code">${esc(r.code)}</div><div><button class="btn ghost sm" data-act="copy" data-text="${esc(r.code)}">คัดลอกรหัส</button></div>
      <dl class="kv" style="margin-top:14px"><dt>ห้องพัก</dt><dd>${esc(r.roomName)}</dd><dt>เข้าพัก</dt><dd>${fmtDate(r.checkIn)}</dd><dt>เช็คเอาท์</dt><dd>${fmtDate(r.checkOut)} (${r.nights} คืน)</dd><dt>ผู้เข้าพัก</dt><dd>${r.guests} ท่าน</dd><dt>ยอดรวม</dt><dd>${money(r.total)}</dd><dt>สถานะ</dt><dd>${badge(r.status)}</dd></dl>
      <p style="white-space:pre-line;font-size:15px">${esc(state.pub.settings.paymentInfo || '')}</p>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ghost" data-act="close">ปิด</button>${lineHref ? `<a class="btn primary" href="${esc(lineHref)}" target="_blank" rel="noopener">${ic('chat', 18)} แจ้งการจอง</a>` : ''}</div></div>`);
    if (state.avail) { state.avail = null; drawRooms(); }
  } catch (err) { fail(err); btn.disabled = false; btn.textContent = 'ส่งคำขอจอง'; }
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const A = state.admin, B = A.bookings, today = todayStr(), month = today.slice(0, 7);
  const paid = b => ['confirmed', 'checked-in', 'completed'].includes(b.status);
  const rev = B.filter(b => paid(b) && b.checkIn.slice(0, 7) === month).reduce((a, b) => a + b.total, 0);
  const pending = B.filter(b => b.status === 'pending').length;
  const arrivals = B.filter(b => b.checkIn === today && b.status !== 'cancelled');
  const departs = B.filter(b => b.checkOut === today && b.status !== 'cancelled');
  const inhouse = B.filter(b => ['confirmed', 'checked-in'].includes(b.status) && b.checkIn <= today && b.checkOut > today);
  const units = A.rooms.filter(r => r.status !== 'hidden').reduce((a, r) => a + r.qty, 0);
  const occ = units ? Math.min(100, Math.round(inhouse.length / units * 100)) : 0;

  const months = []; const now = new Date();
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ k: d.getFullYear() + '-' + pad(d.getMonth() + 1), l: d.toLocaleDateString('th-TH', { month: 'short' }) }); }
  months.forEach(m => { m.v = B.filter(b => paid(b) && b.checkIn.slice(0, 7) === m.k).reduce((a, b) => a + b.total, 0); m.n = B.filter(b => b.status !== 'cancelled' && b.checkIn.slice(0, 7) === m.k).length; });
  const max = Math.max(1, ...months.map(m => m.v));
  const total = B.length || 1;
  const rows = bs => bs.length ? bs.map(b => `<div class="li"><div><b>${esc(b.guestName)}</b><small>${esc(b.roomName)} · ${b.guests} ท่าน</small></div>${badge(b.status)}</div>`).join('') : '<p class="muted" style="margin:0">ไม่มีรายการ</p>';

  $('#tab').innerHTML = topbar('แดชบอร์ด', `<span class="muted">${fmtDate(today)}</span><button class="btn ghost sm" data-act="refresh">รีเฟรช</button>`) + `
    <div class="kpis">
      <div class="card kpi"><div class="ib a">${ic('clock', 24)}</div><div><small>รอยืนยัน</small><b>${pending}</b></div></div>
      <div class="card kpi"><div class="ib b">${ic('user', 24)}</div><div><small>เข้าพักวันนี้</small><b>${arrivals.length}</b></div></div>
      <div class="card kpi"><div class="ib g">${ic('money', 24)}</div><div><small>รายได้เดือนนี้</small><b>${money(rev)}</b></div></div>
      <div class="card kpi"><div class="ib">${ic('bed', 24)}</div><div><small>อัตราการเข้าพักวันนี้</small><b>${occ}%</b></div></div>
    </div>
    <div class="cols">
      <div class="card"><h3>รายได้ 6 เดือนล่าสุด (ตามวันเช็คอิน)</h3>
        <div class="bars">${months.map(m => `<div class="bar" title="${m.n} การจอง"><em>${m.v ? money(m.v) : ''}</em><i style="height:${Math.round(m.v / max * 100)}%"></i><span>${m.l}</span></div>`).join('')}</div></div>
      <div class="card"><h3>สถานะการจองทั้งหมด</h3><div class="stat">${Object.keys(ST).map(k => { const n = B.filter(b => b.status === k).length; return `<div><div class="l"><span>${ST[k][0]}</span><b>${n}</b></div><div class="meter"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>`; }).join('')}</div></div>
    </div>
    <div class="cols3">
      <div class="card"><h3>เช็คอินวันนี้ (${arrivals.length})</h3><div class="lst">${rows(arrivals)}</div></div>
      <div class="card"><h3>เช็คเอาท์วันนี้ (${departs.length})</h3><div class="lst">${rows(departs)}</div></div>
      <div class="card"><h3>กำลังพักอยู่ (${inhouse.length})</h3><div class="lst">${rows(inhouse)}</div></div>
    </div>
    <div class="card" style="margin-top:18px"><h3>การจองล่าสุด</h3>${B.length ? `<div class="tw" style="border:0"><table><thead><tr><th>รหัส</th><th>ผู้เข้าพัก</th><th>ห้อง</th><th>เข้าพัก</th><th class="num">ยอด</th><th>สถานะ</th></tr></thead><tbody>${B.slice(0, 6).map(b => `<tr><td>${esc(b.code)}</td><td>${esc(b.guestName)}</td><td>${esc(b.roomName)}</td><td>${fmtDate(b.checkIn)}</td><td class="num">${money(b.total)}</td><td>${badge(b.status)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">ยังไม่มีการจอง</p>'}</div>`;
}

function exportCsv() {
  const list = filteredBookings();
  if (!list.length) return toast('ไม่มีข้อมูลให้ส่งออก', 'err');
  const head = ['รหัส', 'วันที่จอง', 'ผู้เข้าพัก', 'เบอร์โทร', 'อีเมล', 'ไอดีไลน์', 'ห้อง', 'เช็คอิน', 'เช็คเอาท์', 'คืน', 'ผู้เข้าพัก(ท่าน)', 'ยอดรวม', 'สถานะ', 'หมายเหตุ'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = list.map(b => [b.code, b.createdAt, b.guestName, "'" + b.phone, b.email, b.guestLine || '', b.roomName, b.checkIn, b.checkOut, b.nights, b.guests, b.total, (ST[b.status] || [b.status])[0], b.note].map(cell).join(','));
  const blob = new Blob(['﻿' + [head.map(cell).join(',')].concat(rows).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bookings-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- Calendar ---------- */
function renderCalendar() {
  const m = state.calMonth || todayStr().slice(0, 7); state.calMonth = m;
  const Y = +m.slice(0, 4), M = +m.slice(5, 7), days = new Date(Y, M, 0).getDate(), today = todayStr();
  const bk = state.admin.bookings.filter(b => BLOCK.includes(b.status)), WD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  let head = '<th class="rn">ห้องพัก</th>';
  for (let d = 1; d <= days; d++) { const dt = new Date(Y, M - 1, d), iso = isoOf(dt), we = dt.getDay() === 0 || dt.getDay() === 6; head += `<th class="${we ? 'we' : ''} ${iso === today ? 'today' : ''}">${d}<small>${WD[dt.getDay()]}</small></th>`; }
  const body = state.admin.rooms.map(r => {
    let tds = '';
    for (let d = 1; d <= days; d++) {
      const iso = Y + '-' + pad(M) + '-' + pad(d), n = bk.filter(b => b.roomId === r.id && b.checkIn <= iso && b.checkOut > iso).length;
      tds += `<td class="c ${n ? (n >= r.qty ? 'full' : 'part') : ''}" data-act="cal-cell" data-room="${esc(r.id)}" data-date="${iso}">${n || ''}</td>`;
    }
    return `<tr><td class="rn">${esc(r.name)}<small>${r.qty} ห้อง${r.status === 'hidden' ? ' · ซ่อน' : ''}</small></td>${tds}</tr>`;
  }).join('');
  $('#tab').innerHTML = topbar('ปฏิทินห้องพัก', `<button class="icon-btn sm" data-act="cal-prev" aria-label="เดือนก่อน">${ic('left', 16)}</button><input class="in" type="month" id="cal-m" value="${m}" style="width:auto"><button class="icon-btn sm" data-act="cal-next" aria-label="เดือนถัดไป">${ic('right', 16)}</button>`) +
    (state.admin.rooms.length ? `<div class="cal"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i style="background:#cfe3d6"></i>มีผู้เข้าพักบางส่วน</span><span><i style="background:var(--green)"></i>เต็ม</span><span>ตัวเลข = จำนวนห้องที่ถูกจอง · คลิกที่ช่องเพื่อดูรายละเอียด/เพิ่มการจอง</span></div>` : '<div class="empty">ยังไม่มีห้องพัก</div>');
  const mi = $('#cal-m'); if (mi) mi.onchange = () => { if (mi.value) { state.calMonth = mi.value; renderCalendar(); } };
}
function shiftMonth(n) { const [y, m] = (state.calMonth || todayStr().slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + n, 1); state.calMonth = d.getFullYear() + '-' + pad(d.getMonth() + 1); renderCalendar(); }

      ${imgManager('รูปภาพสถานที่ (รูปแรก = ภาพปก)')}
      <div class="row end"><button type="button" class="btn ghost" data-act="close">ยกเลิก</button><button class="btn primary">บันทึก</button></div>
    </form>`, 'lg');
  drawImgs();
  $('#place-form').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await api('savePlace', { id: id || '', name: f.name.value, description: f.description.value, mapUrl: f.mapUrl.value.trim(), sort: f.sort.value, images: state.tmpImgs }); toast('บันทึกสถานที่แล้ว', 'ok'); closeModal(); await reloadAdmin(true); } catch (err) { fail(err); }
  };
}

/* ---------- Finance: รายได้ / จ่าย ---------- */
const FIN_INC = ['อาหาร/เครื่องดื่ม', 'บริการเสริม', 'ค่ามัดจำ', 'อื่น ๆ'];
const FIN_EXP = ['ค่าไฟฟ้า', 'ค่าน้ำประปา', 'ค่าอินเทอร์เน็ต', 'ค่าแรง/พนักงาน', 'ซ่อมบำรุง', 'ซักรีด/ของใช้ในห้อง', 'วัตถุดิบ/อาหาร', 'การตลาด/โฆษณา', 'อื่น ๆ'];
const PAID_ST = ['confirmed', 'checked-in', 'completed'];

function financeRows() {
  const A = state.admin, m = state.finMonth, rows = [];
  A.bookings.filter(b => PAID_ST.includes(b.status)).forEach(b => rows.push({ auto: true, date: b.checkIn, type: 'income', category: 'ค่าห้องพัก', amount: b.total, note: b.roomName + ' · ' + b.guestName + ' (' + b.code + ')' }));
  (A.finance || []).forEach(f => rows.push({ auto: false, id: f.id, date: f.date, type: f.type, category: f.category, amount: f.amount, note: f.note }));
  return rows.filter(r => !m || String(r.date).slice(0, 7) === m).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function monthLabel(m) { return m ? parseD(m + '-01').toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }) : 'ทุกช่วงเวลา'; }
function shiftFinMonth(n) { const [y, m] = (state.finMonth || todayStr().slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + n, 1); state.finMonth = d.getFullYear() + '-' + pad(d.getMonth() + 1); renderFinance(); }

function renderFinance() {
  const m = state.finMonth, rows = financeRows();
  const tot = arr => arr.reduce((a, r) => a + r.amount, 0);
  const incR = rows.filter(r => r.type === 'income'), expR = rows.filter(r => r.type === 'expense');
  const inc = tot(incR), exp = tot(expR), net = inc - exp, roomInc = tot(rows.filter(r => r.auto));
  const byCat = arr => { const o = {}; arr.forEach(r => { o[r.category] = (o[r.category] || 0) + r.amount; }); return Object.keys(o).sort((a, b) => o[b] - o[a]).map(k => [k, o[k]]); };
  const catBlock = (arr, total) => arr.length ? `<div class="stat">${arr.map(c => `<div><div class="l"><span>${esc(c[0])}</span><b>${money(c[1])}</b></div><div class="meter"><i style="width:${total ? Math.round(c[1] / total * 100) : 0}%"></i></div></div>`).join('')}</div>` : '<p class="muted" style="margin:0">ไม่มีรายการ</p>';
  $('#tab').innerHTML = topbar('รายได้ / จ่าย', `<div class="fin-tools"><button class="icon-btn sm" data-act="fin-prev" aria-label="เดือนก่อน">${ic('left', 16)}</button><input class="in" type="month" id="fin-m" value="${esc(m)}" style="width:auto"><button class="icon-btn sm" data-act="fin-next" aria-label="เดือนถัดไป">${ic('right', 16)}</button><button class="btn ghost sm" data-act="fin-all">ทั้งหมด</button><button class="btn primary sm" data-act="fin-new">${ic('plus', 16)} เพิ่มรายการ</button></div>`) + `
    <p class="muted" style="margin:-8px 0 14px">ช่วงเวลา: <b>${esc(monthLabel(m))}</b> · รายได้ค่าห้องพักคำนวณอัตโนมัติจากการจองที่สถานะ "ยืนยันแล้ว / เข้าพักแล้ว / เสร็จสิ้น" (นับตามวันเช็คอิน)</p>
    <div class="kpis">
      <div class="card kpi"><div class="ib">${ic('money', 24)}</div><div><small>รายรับรวม</small><b class="pos">${money(inc)}</b></div></div>
      <div class="card kpi"><div class="ib a">${ic('wallet', 24)}</div><div><small>รายจ่ายรวม</small><b class="neg">${money(exp)}</b></div></div>
      <div class="card kpi"><div class="ib g">${ic('chart', 24)}</div><div><small>กำไรสุทธิ</small><b class="${net < 0 ? 'neg' : 'pos'}">${net < 0 ? '-' : ''}${money(Math.abs(net))}</b></div></div>
      <div class="card kpi"><div class="ib b">${ic('bed', 24)}</div><div><small>รายได้จากห้องพัก</small><b>${money(roomInc)}</b></div></div>
    </div>
    <div class="cols cols2">
      <div class="card"><h3>รายรับแยกตามหมวด</h3>${catBlock(byCat(incR), inc)}</div>
      <div class="card"><h3>รายจ่ายแยกตามหมวด</h3>${catBlock(byCat(expR), exp)}</div>
    </div>
    <div class="card"><h3>รายการทั้งหมด (${rows.length})</h3>${rows.length ? `<div class="tw" style="border:0"><table><thead><tr><th>วันที่</th><th>ประเภท</th><th>หมวดหมู่</th><th>รายละเอียด</th><th class="num">จำนวนเงิน</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${fmtDate(r.date)}</td><td>${r.type === 'income' ? '<span class="badge b-green">รายรับ</span>' : '<span class="badge b-red">รายจ่าย</span>'}</td><td>${esc(r.category)}</td><td>${esc(r.note) || '<span class="muted">-</span>'}</td><td class="num"><b class="${r.type === 'income' ? 'pos' : 'neg'}">${r.type === 'income' ? '+' : '-'}${money(r.amount)}</b></td><td>${r.auto ? '<span class="badge b-gray">จากการจอง</span>' : `<div class="acts"><button class="icon-btn sm" title="แก้ไข" data-act="fin-edit" data-id="${esc(r.id)}">${ic('edit', 16)}</button><button class="icon-btn sm" title="ลบ" data-act="fin-del" data-id="${esc(r.id)}">${ic('trash', 16)}</button></div>`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ไม่มีรายการในช่วงเวลานี้</div>'}</div>`;
  const mi = $('#fin-m'); if (mi) mi.onchange = () => { if (mi.value) { state.finMonth = mi.value; renderFinance(); } };
}

function openFinanceForm(id) {
  const f = id ? state.admin.finance.find(x => x.id === id) : { type: 'income', date: todayStr(), category: '', amount: '', note: '' };
  if (!f) return;
  openModal(`${xBtn}<h3>${id ? 'แก้ไขรายการ' : 'เพิ่มรายการรายรับ / รายจ่าย'}</h3>
    <form id="fin-form" novalidate>
      <div class="grid2">
        <label class="f"><span>ประเภท</span><select class="in" name="type"><option value="income" ${f.type !== 'expense' ? 'selected' : ''}>รายรับ</option><option value="expense" ${f.type === 'expense' ? 'selected' : ''}>รายจ่าย</option></select></label>
        <label class="f"><span>วันที่</span><input class="in" type="date" name="date" value="${esc(f.date)}" required></label>
      </div>
      <div class="grid2">
        <label class="f"><span>หมวดหมู่ (เลือกหรือพิมพ์เอง)</span><input class="in" name="category" list="fin-cats" value="${esc(f.category)}" maxlength="60" autocomplete="off"></label>
        <label class="f"><span>จำนวนเงิน (บาท)</span><input class="in" type="number" name="amount" min="0" step="0.01" inputmode="decimal" value="${esc(f.amount)}" required></label>
      </div>
      <datalist id="fin-cats"></datalist>
      <label class="f"><span>รายละเอียด / หมายเหตุ</span><textarea class="in" name="note" rows="2" maxlength="300">${esc(f.note)}</textarea></label>
      <div class="row end"><button type="button" class="btn ghost" data-act="close">ยกเลิก</button><button class="btn primary">บันทึก</button></div>
    </form>`, 'sm');
  const fm = $('#fin-form'), setCats = () => { $('#fin-cats').innerHTML = (fm.type.value === 'expense' ? FIN_EXP : FIN_INC).map(c => `<option value="${esc(c)}"></option>`).join(''); };
  fm.type.addEventListener('change', setCats); setCats();
  fm.onsubmit = async e => {
    e.preventDefault();
    if (!fm.date.value) return toast('กรุณาเลือกวันที่', 'err');
    if (!(parseFloat(fm.amount.value) > 0)) return toast('กรุณากรอกจำนวนเงินมากกว่า 0', 'err');
    try {
      await api('saveFinance', { id: id || '', type: fm.type.value, date: fm.date.value, category: fm.category.value, amount: fm.amount.value, note: fm.note.value });
      if (state.finMonth && state.finMonth !== fm.date.value.slice(0, 7)) state.finMonth = fm.date.value.slice(0, 7);
      toast('บันทึกรายการแล้ว', 'ok'); closeModal(); await reloadAdmin(true);
    } catch (err) { fail(err); }
  };
}

/* ---------- Settings ---------- */
function renderSettings() {
  const s = state.admin.settings, i = (n, label, extra) => `<label class="f"><span>${label}</span><input class="in" name="${n}" value="${esc(s[n])}" ${extra || ''}></label>`;
  const ta = (n, label, rows) => `<label class="f"><span>${label}</span><textarea class="in" name="${n}" rows="${rows || 3}">${esc(s[n])}</textarea></label>`;
  $('#tab').innerHTML = topbar('ตั้งค่า', `<button class="btn primary sm" data-act="set-save">${ic('check', 16)} บันทึกการตั้งค่า</button>`) + `
    <form id="set-form" novalidate>
    <div class="cols cols2">
      <div class="card"><h3>ข้อมูลที่พัก</h3>${i('siteName', 'ชื่อที่พัก')}${i('tagline', 'สโลแกน')}${ta('about', 'เกี่ยวกับที่พัก', 4)}
        <label class="f"><span>รูปปกหน้าแรก</span></label><div class="hero-prev" id="hero-prev" style="${s.heroImage ? `background-image:url('${esc(s.heroImage)}')` : ''}"></div>
        <div class="row"><button type="button" class="btn ghost sm" data-act="hero-upload">${ic('up', 16)} อัปโหลดรูปปก</button><input class="in" name="heroImage" value="${esc(s.heroImage)}" placeholder="หรือวางลิงก์รูป" style="flex:1;min-width:160px"></div></div>
      <div class="card"><h3>ช่องทางติดต่อ</h3>${i('phone', 'โทรศัพท์')}${i('lineId', 'ลิงก์ LINE (วางลิงก์ เช่น https://line.me/ti/p/xxxx)')}${i('facebook', 'ลิงก์ Facebook')}${i('tiktok', 'ลิงก์ TikTok')}${i('email', 'อีเมลที่พัก')}${ta('address', 'ที่อยู่', 2)}${i('mapUrl', 'ลิงก์ Google Maps สำหรับปุ่ม "นำทาง" (กดแชร์จากแอปแผนที่ แล้ววางลิงก์)')}</div>
    </div>
    <div class="card" style="margin-top:18px"><h3>การเข้าพักและการจอง</h3>
      <div class="grid3">${i('checkInTime', 'เวลาเช็คอิน')}${i('checkOutTime', 'เวลาเช็คเอาท์')}${i('notifyEmail', 'อีเมลรับแจ้งเตือนจองใหม่')}</div>
      ${ta('paymentInfo', 'ข้อความหลังจอง (เช่น เลขบัญชีมัดจำ / วิธีชำระ)', 3)}
      ${ta('policy', 'ข้อควรทราบ (คั่นแต่ละข้อด้วย | )', 3)}</div>
    </form>
    <div class="card" style="margin-top:18px;max-width:520px"><h3>เปลี่ยนรหัสผ่านแอดมิน</h3>
      <form id="pw-form"><label class="f"><span>รหัสผ่านปัจจุบัน</span><input class="in" type="password" name="cur" autocomplete="current-password" required></label>
      <label class="f"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span><input class="in" type="password" name="nw" autocomplete="new-password" minlength="8" required></label>
      <button class="btn gold sm">เปลี่ยนรหัสผ่าน</button></form></div>`;
  $('#pw-form').onsubmit = async e => {
    e.preventDefault();
    try { await api('changePassword', { current: e.target.cur.value, next: e.target.nw.value }); toast('เปลี่ยนรหัสผ่านแล้ว', 'ok'); e.target.reset(); } catch (err) { fail(err); }
  };
  const hi = $('#set-form').heroImage; hi.addEventListener('change', () => { const u = toImageUrl(hi.value); hi.value = u; $('#hero-prev').style.backgroundImage = u ? `url('${u}')` : ''; });
}

/* ============================================================
 *  Event handlers
 * ============================================================ */
const H = {
  reload: () => location.reload(),
  close: () => closeModal(),
  scroll: el => { setMenu(false); scrollToId(el.dataset.to); },
  menu: () => { const m = $('#mnav'); setMenu(m ? m.hidden : false); },
  'adm-menu': () => { const sd = $('.side'); if (sd) sd.classList.toggle('open'); },
  copy: el => copyText(el.dataset.text),
  'open-admin': () => enterAdmin(),
  lookup: () => { setMenu(false); openLookup(); },
  'clear-avail': () => { state.avail = null; drawRooms(); },
  'room-detail': el => openRoom(el.dataset.id),
  book: el => openBooking(el.dataset.id),
  'rd-img': el => rdShow(+el.dataset.i),
  'rd-prev': () => rdShow(state.rvI - 1),
  'rd-next': () => rdShow(state.rvI + 1),
  'rd-zoom': () => { const r = state.rv; if (r && r.images.length) openLightbox(state.rvI, r.images.map(u => ({ url: u, caption: r.name }))); },
  album: el => openAlbum(el.dataset.id),
  'place-detail': el => openPlace(el.dataset.id),
  'pl-prev': () => plGo(state.plI - 1),
  'pl-next': () => plGo(state.plI + 1),
  'pl-go': el => plGo(+el.dataset.i),
  'rm-prev': () => msShow('#rooms-grid .room', 'rmI', state.rmI - 1),
  'rm-next': () => msShow('#rooms-grid .room', 'rmI', state.rmI + 1),
  'gl-prev': () => msShow('#gallery .gallery figure', 'glI', state.glI - 1),
  'gl-next': () => msShow('#gallery .gallery figure', 'glI', state.glI + 1),
  'lb-close': () => closeLb(),
  'lb-prev': () => { lb.i = (lb.i - 1 + lb.list.length) % lb.list.length; drawLb(); },
  'lb-next': () => { lb.i = (lb.i + 1) % lb.list.length; drawLb(); },

  tab: el => { state.tab = el.dataset.tab; renderAdminShell(); renderTab(); window.scrollTo(0, 0); },
  'go-public': () => leaveAdmin(),
  logout: async () => { try { await api('logout'); } catch (e) { /* ignore */ } saveToken(''); state.admin = null; leaveAdmin(); toast('ออกจากระบบแล้ว'); },
  refresh: () => reloadAdmin(true),

  'bk-new': () => openBookingForm(null),
  'bk-new-at': el => openBookingForm(null, { roomId: el.dataset.room, checkIn: el.dataset.date, checkOut: addDays(el.dataset.date, 1) }),
  'bk-edit': el => openBookingForm(el.dataset.id),
  'bk-del': async el => { if (await askConfirm('ต้องการลบรายการจองนี้ถาวรหรือไม่? (หากต้องการเก็บประวัติ แนะนำให้เปลี่ยนสถานะเป็น "ยกเลิก")', 'ลบถาวร', true)) { await api('deleteBooking', { id: el.dataset.id }); toast('ลบแล้ว', 'ok'); await reloadAdmin(true); } },
  'bk-csv': () => exportCsv(),
  'cal-prev': () => shiftMonth(-1),
  'cal-next': () => shiftMonth(1),
  'cal-cell': el => openCalCell(el.dataset.room, el.dataset.date),

  'room-new': () => openRoomForm(null),
  'room-edit': el => openRoomForm(el.dataset.id),
  'room-toggle': async el => { const r = state.admin.rooms.find(x => x.id === el.dataset.id); await api('saveRoom', Object.assign({}, r, { status: r.status === 'hidden' ? 'active' : 'hidden' })); await reloadAdmin(true); },
  'room-del': async el => { if (await askConfirm('ต้องการลบห้องพักนี้หรือไม่?', 'ลบห้อง', true)) { await api('deleteRoom', { id: el.dataset.id }); toast('ลบห้องแล้ว', 'ok'); await reloadAdmin(true); } },
  'img-upload': async () => { const files = await pickFiles(true); if (!files.length) return; try { const urls = await uploadFiles(files); state.tmpImgs = state.tmpImgs.concat(urls); drawImgs(); toast('อัปโหลดสำเร็จ', 'ok'); } catch (e) { fail(e); } },
  'img-link': () => { const i = $('#img-url'), u = toImageUrl(i.value); if (!u) return; state.tmpImgs.push(u); i.value = ''; drawImgs(); },
  'img-main': el => { const i = +el.dataset.i, u = state.tmpImgs.splice(i, 1)[0]; state.tmpImgs.unshift(u); drawImgs(); },
  'img-del': el => { state.tmpImgs.splice(+el.dataset.i, 1); drawImgs(); },

  'album-new': () => openAlbumForm(null),
  'album-edit': el => openAlbumForm(el.dataset.id),
  'album-del': async el => { if (await askConfirm('ต้องการลบอัลบั้มนี้หรือไม่? (ไฟล์รูปในไดร์ฟจะยังอยู่)', 'ลบอัลบั้ม', true)) { await api('deleteAlbum', { id: el.dataset.id }); toast('ลบอัลบั้มแล้ว', 'ok'); await reloadAdmin(true); } },
  'place-new': () => openPlaceForm(null),
  'place-edit': el => openPlaceForm(el.dataset.id),
  'place-del': async el => { if (await askConfirm('ต้องการลบสถานที่ท่องเที่ยวนี้หรือไม่? (ไฟล์รูปในไดร์ฟจะยังอยู่)', 'ลบสถานที่', true)) { await api('deletePlace', { id: el.dataset.id }); toast('ลบสถานที่แล้ว', 'ok'); await reloadAdmin(true); } },
  'fin-new': () => openFinanceForm(null),
  'fin-edit': el => openFinanceForm(el.dataset.id),
  'fin-del': async el => { if (await askConfirm('ต้องการลบรายการนี้ถาวรหรือไม่?', 'ลบรายการ', true)) { await api('deleteFinance', { id: el.dataset.id }); toast('ลบรายการแล้ว', 'ok'); await reloadAdmin(true); } },
  'fin-prev': () => shiftFinMonth(-1),
  'fin-next': () => shiftFinMonth(1),
  'fin-all': () => { state.finMonth = ''; renderFinance(); },

  'hero-upload': async () => { const files = await pickFiles(false); if (!files.length) return; try { const u = (await uploadFiles(files))[0]; $('#set-form').heroImage.value = u; $('#hero-prev').style.backgroundImage = `url('${u}')`; toast('อัปโหลดแล้ว อย่าลืมกด "บันทึกการตั้งค่า"', 'ok'); } catch (e) { fail(e); } },
  'set-save': async () => {
    const f = $('#set-form'), o = {};
    ['siteName', 'tagline', 'about', 'phone', 'lineId', 'facebook', 'tiktok', 'email', 'address', 'mapUrl', 'heroImage', 'checkInTime', 'checkOutTime', 'notifyEmail', 'paymentInfo', 'policy'].forEach(k => { o[k] = f[k].value; });
    if (!o.siteName.trim()) return toast('กรุณากรอกชื่อที่พัก', 'err');
    await api('saveSettings', o); toast('บันทึกการตั้งค่าแล้ว', 'ok'); await reloadAdmin(true);
  }
};
const CH = {
  'bk-status': async el => { try { await api('setBookingStatus', { id: el.dataset.id, status: el.value }); toast('อัปเดตสถานะแล้ว', 'ok'); await reloadAdmin(true); } catch (e) { fail(e); await reloadAdmin(true); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'ovclose') { if (e.target === el) closeModal(); return; }
  if (el.tagName === 'A') e.preventDefault();
  const h = H[act]; if (!h) return;
  Promise.resolve().then(() => h(el, e)).catch(fail);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const h = CH[el.dataset.chg]; if (h) Promise.resolve().then(() => h(el)).catch(fail);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#lightbox').hidden) closeLb(); else if ($('#dlg-root').innerHTML) { /* ปล่อยให้ปุ่มจัดการ */ } else closeModal(); }
  if (!$('#lightbox').hidden) { if (e.key === 'ArrowLeft') H['lb-prev'](); if (e.key === 'ArrowRight') H['lb-next'](); }
  else if ($('#rd-img') && state.rv && state.rv.images.length > 1) { if (e.key === 'ArrowLeft') rdShow(state.rvI - 1); if (e.key === 'ArrowRight') rdShow(state.rvI + 1); }
});
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
addSwipe($('#lightbox'), d => { if (!$('#lightbox').hidden && lb.list.length > 1) { d > 0 ? H['lb-next']() : H['lb-prev'](); } });

init();
})();
</script>
</body>
</html>
